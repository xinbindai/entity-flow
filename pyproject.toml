[project]
name = "entity-flow"
version = "0.1.0"
description = "Entity-event-task model for a sequencing lab platform: a unified polymorphic entity schema plus transactional-outbox event machinery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the reusable half is packaged. taxonomy.py and demo.py are this
# deployment's domain configuration and example handlers -- another
# deployment replaces them, so shipping them in the wheel would contradict
# the split described in section 7 of the architecture doc. Both stay
# importable when running from the repo root, which is how the tests and the
# scripts run either way.
packages = ["entitymodel"]
