[project]
name = "entity-flow"
version = "0.6.0"
description = "Entity-event-task model for a sequencing lab platform: a unified polymorphic entity schema plus transactional-outbox event machinery"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xinbin Dai", email = "daixinbin@gmail.com" }]
# Only 3.12 is claimed: it is the floor requires-python sets and the only
# version the suite runs against. Listing 3.13 would be a guess.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # 5.3.5 is the floor, not a preference: it is the first release that
    # runs on Python 3.12. Earlier ones call entry_points().get(), which
    # importlib.metadata dropped in 3.12, and crash on import.
    "celery>=5.3.5",
    # psycopg2, not psycopg2-binary: the binary wheel bundles its own copies
    # of libpq and OpenSSL, and a library that pins those on every consumer
    # is deciding something that belongs to the deployment. The cost is that
    # installing now builds from source, so it needs pg_config (libpq-dev or
    # equivalent) and a C compiler present.
    "psycopg2>=2.9.12",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/xinbindai/entity-flow"
Repository = "https://github.com/xinbindai/entity-flow"
Issues = "https://github.com/xinbindai/entity-flow/issues"
Changelog = "https://github.com/xinbindai/entity-flow/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the reusable half is packaged. taxonomy.py and demo.py are this
# deployment's domain configuration and example handlers -- another
# deployment replaces them, so shipping them in the wheel would contradict
# the split described in section 7 of the architecture doc. Both stay
# importable when running from the repo root, which is how the tests and the
# scripts run either way.
packages = ["entitymodel"]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
]
